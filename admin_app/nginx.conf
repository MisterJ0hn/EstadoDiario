server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Rutas de Angular: todo lo que no sea un archivo va al index.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # La API de administración, NO la de los estudios. Cruzarlas dejaría la
    # consola hablando con el backend de los clientes, que rechaza sus tokens
    # (ambito=sistema vs ambito=cliente) con un 403 difícil de leer.
    #
    # Al pasar por acá, la SPA y la API quedan en el mismo origen y CORS deja
    # de existir para el despliegue en Docker: por eso environment.prod.ts usa
    # una URL relativa.
    location /api/ {
        proxy_pass http://admin_api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
