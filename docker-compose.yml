version: "3.9"

# NOTA: PostgreSQL NO se levanta en Docker. Se usa el PostgreSQL
# instalado en la máquina Linux anfitriona (host).
# El backend lo alcanza vía "host.docker.internal", que se resuelve
# gracias a `extra_hosts: host-gateway` (requiere Docker >= 20.10).
# Con un Docker más antiguo: borrar el bloque extra_hosts y poner en
# .env  POSTGRES_HOST=172.17.0.1  (IP del bridge docker0 del host).
#
# pgAdmin tampoco corre en Docker: al vivir la BD en el host, se
# administra con psql o con un pgAdmin instalado nativamente.

services:
  # ─── Backend (FastAPI) ── puerto 8091 ──────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ed_backend
    restart: unless-stopped
    environment:
      - APP_ENV=${APP_ENV}
      - POSTGRES_HOST=${POSTGRES_HOST:-host.docker.internal}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - BACKEND_SECRET_KEY=${BACKEND_SECRET_KEY}
      - BACKEND_ACCESS_TOKEN_EXPIRE_MINUTES=${BACKEND_ACCESS_TOKEN_EXPIRE_MINUTES}
      - BACKEND_REFRESH_TOKEN_EXPIRE_DAYS=${BACKEND_REFRESH_TOKEN_EXPIRE_DAYS}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      - BACKEND_LOG_LEVEL=${BACKEND_LOG_LEVEL}
      - MAIL_ENCRYPTION_KEY=${MAIL_ENCRYPTION_KEY:-}
      - TIMEZONE=${TIMEZONE:-America/Santiago}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:8090}
    ports:
      - "${BACKEND_PORT:-8091}:8000"
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ed_network

  # ─── Frontend (Angular) ── puerto 8090 ─────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ed_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8090}:80"
    depends_on:
      - backend
    networks:
      - ed_network

  # ─── admin_api (FastAPI) ── puerto 8092 ────────────────
  # Consola de plataforma. Es OTRO servicio, no otro endpoint del backend:
  # distinto público (el operador de Temposoft, no los estudios) y tokens con
  # ambito=sistema que el backend de clientes rechaza, y viceversa.
  #
  # El contexto es la RAÍZ del repo porque la imagen tiene que incluir
  # backend/app: admin_api reutiliza los modelos, el cifrado y el esquema de
  # las bases de cliente en vez de copiarlos. Sin ese directorio no levanta.
  admin_api:
    build:
      context: .
      dockerfile: admin_api/Dockerfile
    container_name: ed_admin_api
    restart: unless-stopped
    environment:
      - APP_ENV=${APP_ENV}
      - POSTGRES_HOST=${POSTGRES_HOST:-host.docker.internal}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - TENANT_DB_PREFIJO=${TENANT_DB_PREFIJO:-estado_diario_}
      # Tiene que ser LA MISMA que la del backend: firma los tokens y además
      # es la semilla del cifrado de RUTs y del hash de búsqueda. Con claves
      # distintas, lo que cifra la consola el backend no lo puede leer.
      - BACKEND_SECRET_KEY=${BACKEND_SECRET_KEY}
      - BACKEND_ACCESS_TOKEN_EXPIRE_MINUTES=${BACKEND_ACCESS_TOKEN_EXPIRE_MINUTES}
      - BACKEND_REFRESH_TOKEN_EXPIRE_DAYS=${BACKEND_REFRESH_TOKEN_EXPIRE_DAYS}
      - BACKEND_LOG_LEVEL=${BACKEND_LOG_LEVEL}
      - MAIL_ENCRYPTION_KEY=${MAIL_ENCRYPTION_KEY:-}
      - TIMEZONE=${TIMEZONE:-America/Santiago}
      - ADMIN_INICIAL_USUARIO=${ADMIN_INICIAL_USUARIO:-admin}
      - ADMIN_INICIAL_PASSWORD=${ADMIN_INICIAL_PASSWORD:-admin123}
      # Sirviendo la consola por su Nginx (servicio admin_app) la SPA y la API
      # quedan en el mismo origen y esto no se usa. Queda por si se expone el
      # puerto 8092 directo a un navegador.
      - ADMIN_API_CORS_ORIGINS=${ADMIN_API_CORS_ORIGINS:-http://localhost:8093}
    ports:
      - "${ADMIN_API_PORT:-8092}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ed_network

  # ─── admin_app (Angular) ── puerto 8093 ────────────────
  admin_app:
    build:
      context: ./admin_app
      dockerfile: Dockerfile
    container_name: ed_admin_app
    restart: unless-stopped
    ports:
      - "${ADMIN_APP_PORT:-8093}:80"
    depends_on:
      - admin_api
    networks:
      - ed_network

volumes:
  backend_uploads:

networks:
  ed_network:
    driver: bridge
