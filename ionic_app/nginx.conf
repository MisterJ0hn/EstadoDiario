server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Rutas de Angular: todo lo que no sea un archivo va al index.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El backend de los ESTUDIOS (no admin_api). Al pasar por acá, la app y la
    # API quedan en el mismo origen y CORS deja de existir para el despliegue
    # web: por eso environment.web.ts usa una URL relativa.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # La carga de un estado diario es un Excel: el default de 1M lo corta
        # con un 413 que en pantalla se ve como "error al subir el archivo".
        client_max_body_size 50M;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
